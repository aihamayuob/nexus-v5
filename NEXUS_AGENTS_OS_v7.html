<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="NEXUS AGENTS OS v7.0 - Advanced AI Multi-Agent Operating System">
    <title>NEXUS AGENTS OS v7.0 Ultimate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --bg-dark: #0f172a;
            --bg-darker: #082f49;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --agent-blue: #3b82f6;
            --agent-teal: #14b8a6;
            --agent-purple: #a855f7;
            --agent-red: #ef4444;
            --agent-amber: #f59e0b;
            --agent-pink: #ec4899;
            --agent-yellow: #eab308;
            --agent-gray: #6b7280;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--bg-darker);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 0.875rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-header .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            color: var(--primary);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sidebar-header .version {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
        }

        .close-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
        }

        /* Region Settings */
        .settings-section {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(6, 182, 212, 0.05);
        }

        .settings-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.25rem;
        }

        .btn-region {
            padding: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background-color: #1e293b;
            color: var(--text-muted);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-region:hover {
            border-color: var(--border-color);
        }

        .btn-region.active {
            background-color: rgba(6, 182, 212, 0.2);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }

        /* AI Engines */
        .engines-section {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            background-color: rgba(6, 182, 212, 0.02);
        }

        .engines-section::-webkit-scrollbar {
            width: 6px;
        }

        .engines-section::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        .engine-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem;
            margin-bottom: 0.25rem;
            border: 1px solid var(--border-color);
            background-color: #1e293b;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .engine-item:hover {
            border-color: var(--border-color);
        }

        .engine-item.active {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }

        .engine-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .engine-tag {
            font-size: 0.625rem;
            font-family: 'Space Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Social Platforms */
        .social-section {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(6, 182, 212, 0.02);
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.375rem;
        }

        .social-btn {
            aspect-ratio: 1;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            transform: scale(1.1);
            color: var(--primary);
        }

        /* Share Section */
        .share-section {
            padding: 0.75rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            flex-shrink: 0;
        }

        .share-input-group {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .share-input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            outline: none;
            direction: ltr;
        }

        .copy-btn {
            padding: 0.5rem 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--primary-dark);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 999;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.625rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.125rem;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 2rem;
        }

        .empty-state h2 {
            font-size: 1.875rem;
            font-weight: 900;
            color: var(--text-light);
        }

        .empty-state p {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 0.75rem;
            width: 100%;
            max-width: 1200px;
        }

        .agent-card {
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
        }

        .agent-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 24px rgba(6, 182, 212, 0.25);
        }

        .agent-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .agent-title {
            font-weight: 700;
            font-size: 0.875rem;
            color: white;
            margin-bottom: 0.25rem;
        }

        .agent-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Chat Messages */
        .chat-message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-content.user {
            background-color: rgba(6, 182, 212, 0.2);
            color: var(--text-light);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .message-content.ai {
            background-color: #1e293b;
            color: var(--text-light);
            border: 1px solid var(--border-color);
        }

        .message-time {
            font-size: 0.625rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            opacity: 0.6;
        }

        .loading-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #1e293b;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(6, 182, 212, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Input Area */
        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .input-field {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-light);
            font-size: 0.875rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: 2px 0 8px rgba(0, 0, 0, 0.3);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .close-btn {
                display: block;
            }

            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background-color: rgba(0, 0, 0, 0.7);
                z-index: 999;
                backdrop-filter: blur(4px);
            }

            .overlay.open {
                display: block;
            }

            .agents-grid {
                grid-template-columns: 1fr;
            }

            .message-content {
                max-width: 90%;
            }
        }

        @media (max-width: 640px) {
            .chat-area {
                padding: 1rem;
            }

            .input-area {
                padding: 0.75rem;
            }

            .agents-grid {
                gap: 0.5rem;
            }

            .agent-card {
                padding: 0.75rem;
            }

            .empty-state h2 {
                font-size: 1.5rem;
            }

            .empty-state p {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div>
                    <h1><span class="pulse">⚡</span>NEXUS OS</h1>
                    <div class="sidebar-header version">v7.0 Ultimate</div>
                </div>
                <button class="close-btn" id="closeBtn">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>

            <!-- Region Settings -->
            <div class="settings-section">
                <div class="settings-label">🌍 Region</div>
                <div class="button-group">
                    <button class="btn-region active" data-region="Global">Global</button>
                    <button class="btn-region" data-region="Arabic">Arabic</button>
                    <button class="btn-region" data-region="Asian">Asian</button>
                    <button class="btn-region" data-region="European">European</button>
                </div>
            </div>

            <!-- AI Engines -->
            <div class="engines-section">
                <div class="settings-label">🧠 AI Engines (9)</div>
                <div id="enginesList"></div>
            </div>

            <!-- Social Platforms -->
            <div class="social-section">
                <div class="settings-label">🔗 Social Shortcuts</div>
                <div class="social-grid" id="socialGrid"></div>
            </div>

            <!-- Share Section -->
            <div class="share-section">
                <div class="settings-label">📤 Share</div>
                <div class="share-input-group">
                    <input type="text" class="share-input" id="shareUrl" readonly>
                    <button class="copy-btn" id="copyBtn">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="empty-state" id="emptyState">
                    <div>
                        <h2>Welcome to NEXUS OS</h2>
                        <p>Select an agent or ask anything</p>
                    </div>
                    <div class="agents-grid" id="agentsGrid"></div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-group">
                    <input type="text" class="input-field" id="inputField" placeholder="Ask anything or select an agent...">
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================================
        // CONSTANTS & DATA
        // ============================================================================

        const AI_ENGINES = {
            gemini: { name: 'Gemini Pro', icon: '🧠', modelTag: 'gemini', fallback: 'openai' },
            openai: { name: 'OpenAI GPT-4', icon: '⚡', modelTag: 'openai', fallback: 'claude' },
            claude: { name: 'Claude Sonnet', icon: '🎭', modelTag: 'claude', fallback: 'gemini' },
            deepseek: { name: 'DeepSeek R1', icon: '🧩', modelTag: 'searchgpt', fallback: 'openai' },
            grok: { name: 'Grok xAI', icon: '👁️', modelTag: 'grok', fallback: 'openai' },
            kimi: { name: 'Kimi Premium', icon: '🪶', modelTag: 'kimi', fallback: 'claude' },
            felo: { name: 'Felo Search', icon: '🔍', modelTag: 'searchgpt', fallback: 'gemini' },
            copilot: { name: 'Copilot Hub', icon: '🧭', modelTag: 'openai', fallback: 'openai' },
            manos: { name: 'Manos AI', icon: '🤖', modelTag: 'manos', fallback: 'gemini' }
        };

        const AGENTS = [
            {
                id: 'customer',
                title: 'Customer Service Agent',
                desc: 'Handle complaints, provide diplomatic responses, manage support tickets intelligently.',
                icon: '🎧',
                role: 'You are an expert international customer service agent focused on solving problems and increasing satisfaction.'
            },
            {
                id: 'accountant',
                title: 'Accounting & Audit Agent',
                desc: 'Organize taxes, calculate cash flows, prepare quarterly budgets with precision.',
                icon: '📊',
                role: 'You are a certified accountant and financial manager skilled in tax calculations and budget auditing.'
            },
            {
                id: 'hr',
                title: 'HR Management Agent',
                desc: 'Prepare organizational structures, draft work policies, evaluate annual performance.',
                icon: '👥',
                role: 'You are an expert HR manager skilled in employment policies, contracts, and productivity evaluation.'
            },
            {
                id: 'legal',
                title: 'Legal Advisor Agent',
                desc: 'Draft commercial contracts, protect intellectual property, minimize legal risks.',
                icon: '⚖️',
                role: 'You are an expert legal advisor specialized in commercial law and contract drafting.'
            },
            {
                id: 'investor',
                title: 'Investment Analyst Agent',
                desc: 'Analyze investment opportunities, monitor markets, develop hedging strategies.',
                icon: '💰',
                role: 'You are an investment advisor and market analyst specializing in portfolio management and risk distribution.'
            },
            {
                id: 'marketing',
                title: 'Marketing & SEO Agent',
                desc: 'Build advertising campaigns, create growth strategies, target audiences effectively.',
                icon: '📢',
                role: 'You are a professional digital marketing manager skilled in rapid growth campaigns and SEO optimization.'
            },
            {
                id: 'innovation',
                title: 'Innovation & Development Agent',
                desc: 'Generate unconventional ideas, develop business models, find out-of-the-box solutions.',
                icon: '💡',
                role: 'You are an innovation director providing creative ideas and strategic solutions for complex problems.'
            },
            {
                id: 'custom',
                title: 'Custom Agent',
                desc: 'Adaptable agent that shapes itself based on your specific needs and requests.',
                icon: '⚙️',
                role: 'You are a flexible, highly specialized agent that adapts immediately to the user\'s needs and requests.'
            }
        ];

        const SOCIAL_PLATFORMS = [
            { name: 'Twitter/X', icon: '𝕏', url: 'https://twitter.com' },
            { name: 'LinkedIn', icon: 'in', url: 'https://linkedin.com' },
            { name: 'Instagram', icon: '📷', url: 'https://instagram.com' },
            { name: 'Facebook', icon: 'f', url: 'https://facebook.com' },
            { name: 'TikTok', icon: '♪', url: 'https://tiktok.com' },
            { name: 'YouTube', icon: '▶️', url: 'https://youtube.com' },
            { name: 'WhatsApp', icon: '💬', url: 'https://wa.me' },
            { name: 'Telegram', icon: '✈️', url: 'https://t.me' },
            { name: 'Discord', icon: '🎮', url: 'https://discord.com' },
            { name: 'GitHub', icon: '🐙', url: 'https://github.com' }
        ];

        // ============================================================================
        // STATE MANAGEMENT
        // ============================================================================

        const state = {
            selectedEngine: 'gemini',
            selectedRegion: 'Global',
            chatList: [],
            isLoading: false,
            activeAgentRole: null,
            responseCache: new Map()
        };

        // ============================================================================
        // DOM ELEMENTS
        // ============================================================================

        const elements = {
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('overlay'),
            menuToggle: document.getElementById('menuToggle'),
            closeBtn: document.getElementById('closeBtn'),
            chatArea: document.getElementById('chatArea'),
            emptyState: document.getElementById('emptyState'),
            inputField: document.getElementById('inputField'),
            sendBtn: document.getElementById('sendBtn'),
            shareUrl: document.getElementById('shareUrl'),
            copyBtn: document.getElementById('copyBtn'),
            enginesList: document.getElementById('enginesList'),
            socialGrid: document.getElementById('socialGrid'),
            agentsGrid: document.getElementById('agentsGrid')
        };

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        function initializeUI() {
            renderEngines();
            renderSocialPlatforms();
            renderAgents();
            setupEventListeners();
            updateShareUrl();
        }

        function renderEngines() {
            elements.enginesList.innerHTML = Object.entries(AI_ENGINES).map(([key, engine]) => `
                <div class="engine-item ${key === state.selectedEngine ? 'active' : ''}" data-engine="${key}">
                    <span class="engine-name">
                        <span>${engine.icon}</span>
                        ${engine.name}
                    </span>
                    <span class="engine-tag">${engine.modelTag}</span>
                </div>
            `).join('');

            document.querySelectorAll('.engine-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.engine-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    state.selectedEngine = item.dataset.engine;
                });
            });
        }

        function renderSocialPlatforms() {
            elements.socialGrid.innerHTML = SOCIAL_PLATFORMS.map(platform => `
                <a href="${platform.url}" target="_blank" rel="noopener noreferrer" class="social-btn" title="${platform.name}">
                    ${platform.icon}
                </a>
            `).join('');
        }

        function renderAgents() {
            elements.agentsGrid.innerHTML = AGENTS.map(agent => `
                <div class="agent-card" data-agent="${agent.id}">
                    <div class="agent-icon">${agent.icon}</div>
                    <div class="agent-title">${agent.title}</div>
                    <div class="agent-desc">${agent.desc}</div>
                </div>
            `).join('');

            document.querySelectorAll('.agent-card').forEach(card => {
                card.addEventListener('click', () => {
                    const agentId = card.dataset.agent;
                    const agent = AGENTS.find(a => a.id === agentId);
                    selectAgent(agent);
                });
            });
        }

        function setupEventListeners() {
            // Region buttons
            document.querySelectorAll('.btn-region').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn-region').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.selectedRegion = btn.dataset.region;
                });
            });

            // Menu toggle
            elements.menuToggle.addEventListener('click', () => {
                elements.sidebar.classList.add('open');
                elements.overlay.classList.add('open');
            });

            elements.closeBtn.addEventListener('click', () => {
                elements.sidebar.classList.remove('open');
                elements.overlay.classList.remove('open');
            });

            elements.overlay.addEventListener('click', () => {
                elements.sidebar.classList.remove('open');
                elements.overlay.classList.remove('open');
            });

            // Input field
            elements.inputField.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !state.isLoading) {
                    handleExecute();
                }
            });

            // Send button
            elements.sendBtn.addEventListener('click', handleExecute);

            // Copy button
            elements.copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href);
                const originalText = elements.copyBtn.innerHTML;
                elements.copyBtn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    elements.copyBtn.innerHTML = originalText;
                }, 2000);
            });
        }

        function updateShareUrl() {
            elements.shareUrl.value = window.location.href;
        }

        // ============================================================================
        // CHAT FUNCTIONALITY
        // ============================================================================

        async function handleExecute() {
            const query = elements.inputField.value.trim();
            if (!query || state.isLoading) return;

            state.isLoading = true;
            elements.sendBtn.disabled = true;

            // Add user message
            addMessage('user', query);
            elements.inputField.value = '';

            try {
                // Build system prompt
                let systemPrompt = state.activeAgentRole || 'You are the central agent system for Nexus OS.';

                if (query.match(/(who are you|what is nexus|about platform|platform goals)/gi)) {
                    systemPrompt = `You are the central intelligent system of NEXUS AGENTS OS v7.0 Ultimate. Provide a comprehensive answer covering:
1. Architecture: An integrated, independent AI execution environment managing multiple AI minds as a unified processing block.
2. Strategic Goals: Eliminate bureaucracy, provide expert consultants with near-zero error rates, fully automate business operations.
3. Current Capabilities: Absolute data privacy, multilingual support, regional sovereignty [Active Region: ${state.selectedRegion}].
4. Future Vision: Multi-Agent Swarms for autonomous thinking and decision-making, IoT integration for physical asset management.`;
                }

                const response = await fetchAIResponse(query, state.selectedEngine, systemPrompt);
                addMessage('ai', response);
            } catch (error) {
                const errorMsg = error.message.includes('timeout') 
                    ? '⏱️ Request timeout. Please try again.'
                    : '❌ Failed to establish connection. Please retry.';
                addMessage('ai', errorMsg);
            } finally {
                state.isLoading = false;
                elements.sendBtn.disabled = false;
                elements.inputField.focus();
            }
        }

        async function fetchAIResponse(query, engine, systemPrompt, retries = 3) {
            const cacheKey = `${engine}:${query}`;
            const cached = state.responseCache.get(cacheKey);
            if (cached) return cached;

            const engines = [engine, AI_ENGINES[engine]?.fallback || 'openai'].filter(Boolean);

            for (const currentEngine of engines) {
                for (let attempt = 0; attempt < retries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000);

                        const response = await fetch(
                            `https://text.pollinations.ai/${encodeURIComponent(query)}?system=${encodeURIComponent(systemPrompt)}&model=${AI_ENGINES[currentEngine]?.modelTag || 'openai'}&private=true`,
                            {
                                signal: controller.signal,
                                headers: {
                                    'Accept': 'text/plain',
                                    'User-Agent': 'NEXUS-OS/7.0'
                                }
                            }
                        );

                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            if (response.status === 429) {
                                await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
                                continue;
                            }
                            throw new Error(`API Error: ${response.status}`);
                        }

                        let text = await response.text();
                        text = text
                            .replace(/Please migrate to our new service[\s\S]*?working normal/gi, '')
                            .replace(/.*(IMPORTANT NOTICE|deprecated|pollinations).*/gi, '')
                            .trim();

                        if (!text || text.length < 5) {
                            text = '🚀 Request processed successfully through Nexus OS neural network.';
                        }

                        state.responseCache.set(cacheKey, text);
                        return text;
                    } catch (error) {
                        if (attempt === retries - 1 && currentEngine === engines[engines.length - 1]) {
                            throw error;
                        }
                        await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt)));
                    }
                }
            }

            throw new Error('All AI engines failed to respond');
        }

        function addMessage(role, text) {
            if (state.chatList.length === 0) {
                elements.emptyState.style.display = 'none';
            }

            const message = { role, text, timestamp: new Date() };
            state.chatList.push(message);

            const messageEl = document.createElement('div');
            messageEl.className = `chat-message ${role}`;
            messageEl.innerHTML = `
                <div>
                    <div class="message-content ${role}">
                        ${text.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                    </div>
                    <div class="message-time">${message.timestamp.toLocaleTimeString()}</div>
                </div>
            `;

            elements.chatArea.appendChild(messageEl);
            elements.chatArea.scrollTop = elements.chatArea.scrollHeight;
        }

        function selectAgent(agent) {
            state.activeAgentRole = agent.role;
            handleExecute();
        }

        // ============================================================================
        // STARTUP
        // ============================================================================

        document.addEventListener('DOMContentLoaded', initializeUI);
    </script>
</body>
</html>
