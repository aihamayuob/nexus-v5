<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Agents - منصة الوكلاء الذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #e2e8f0; margin:0; overflow:hidden; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .prose { color: #e2e8f0; line-height: 1.8; }
    .prose a { color: #60a5fa; }
    .prose code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
    .prose pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; direction: ltr; text-align: left; }
    .prose blockquote { border-right: 3px solid #06b6d4; padding-right: 1rem; color: #94a3b8; }
    input, textarea { outline: none; }
    .agent-active { background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.3); color: #67e8f9; }
    .btn-cyan { background: #06b6d4; color: white; }
    .btn-cyan:hover { background: #0891b2; }
    .btn-red { background: rgba(239, 68, 68, 0.8); }
    .btn-red:hover { background: #ef4444; }
    .btn-gray { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .btn-gray:hover { background: rgba(255,255,255,0.2); }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      UserCog, Calculator, Scale, Users, TrendingUp, Megaphone,
      Lightbulb, Search, BarChart3, Shield, Target, GraduationCap,
      HeartPulse, Headphones, Bot, PanelLeftOpen, PanelLeftClose,
      Library, Settings, Send, Square, X, Plus, Trash2, Key
    } = window.lucide;

    const AGENTS = [
      { id: 'manager', name: 'الوكيل المدير', description: 'إدارة وتوجيه الوكلاء وصياغة القرارات', icon: UserCog, color: 'cyan', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'accountant', name: 'المحاسب', description: 'التحليل المالي والحسابات الدقيقة', icon: Calculator, color: 'green', preferredProvider: 'openai', preferredModel: 'gpt-4o', providerLabel: 'GPT-4o' },
      { id: 'legal', name: 'القانوني', description: 'الاستشارات القانونية وصياغة العقود', icon: Scale, color: 'orange', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'hr', name: 'الموارد البشرية', description: 'إدارة شؤون الموظفين والتوظيف', icon: Users, color: 'purple', preferredProvider: 'openai', preferredModel: 'gpt-4o', providerLabel: 'GPT-4o' },
      { id: 'investor', name: 'المستثمر', description: 'تحليل الاستثمارات والأسواق المالية', icon: TrendingUp, color: 'cyan', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'marketing', name: 'التسويق', description: 'استراتيجيات التسويق الرقمي والمبيعات', icon: Megaphone, color: 'red', preferredProvider: 'openai', preferredModel: 'gpt-4o', providerLabel: 'GPT-4o' },
      { id: 'innovator', name: 'المبتكر', description: 'توليد الأفكار الإبداعية والابتكار', icon: Lightbulb, color: 'orange', preferredProvider: 'google', preferredModel: 'gemini-1.5-pro', providerLabel: 'Gemini Pro' },
      { id: 'researcher', name: 'الباحث', description: 'البحث العلمي المعمق وجمع البيانات', icon: Search, color: 'cyan', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'data_analyst', name: 'محلل البيانات', description: 'تحليل البيانات المعقدة واستخراج الأنماط', icon: BarChart3, color: 'purple', preferredProvider: 'openai', preferredModel: 'gpt-4o', providerLabel: 'GPT-4o' },
      { id: 'security', name: 'الأمن', description: 'الأمن السيبراني وحماية النظم', icon: Shield, color: 'red', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'strategy', name: 'الاستراتيجية', description: 'التخطيط الاستراتيجي وتحليل السوق', icon: Target, color: 'green', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'education', name: 'التعليم', description: 'التطوير المهني وتصميم المناهج', icon: GraduationCap, color: 'orange', preferredProvider: 'openai', preferredModel: 'gpt-4o', providerLabel: 'GPT-4o' },
      { id: 'health', name: 'الصحة', description: 'الاستشارات الصحية والطبية العامة', icon: HeartPulse, color: 'red', preferredProvider: 'anthropic', preferredModel: 'claude-3-5-sonnet-20241022', providerLabel: 'Claude Sonnet' },
      { id: 'support', name: 'خدمة العملاء', description: 'دعم العملاء وحل المشكلات', icon: Headphones, color: 'cyan', preferredProvider: 'openai', preferredModel: 'gpt-4o-mini', providerLabel: 'GPT-4o Mini' },
    ];

    const safeParse = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; } };
    const safeSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { console.warn('Storage error:', e); } };
    const getKeys = () => safeParse('nexus_keys', {});
    const setKeys = (k) => safeSet('nexus_keys', k);
    const getKnowledge = () => safeParse('nexus_kb', []);
    const setKnowledge = (items) => safeSet('nexus_kb', items);
    const getSavedAgent = () => safeParse('nexus_agent', AGENTS[0]);
    const getSavedMessages = () => safeParse('nexus_messages', []);
    const getSavedKnowledgeIds = () => safeParse('nexus_knowledgeIds', []);
    const saveConversation = (c) => {
      try {
        const convs = safeParse('nexus_conv', []);
        convs.unshift(c);
        safeSet('nexus_conv', convs);
      } catch {}
    };

    async function streamAnthropic(apiKey, model, system, messages, onChunk, onError, signal) {
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, max_tokens: 4096, system, messages: messages.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })), stream: true }),
          signal
        });
        if (!res.ok) throw new Error(`Anthropic خطأ ${res.status}`);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n'); buf = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const d = JSON.parse(line.slice(6));
                if (d.type === 'content_block_delta' && d.delta?.text) onChunk(d.delta.text);
              } catch {}
            }
          }
        }
      } catch (e) { if (e.name !== 'AbortError') onError(e.message); }
    }

    async function streamOpenAI(apiKey, model, system, messages, onChunk, onError, signal) {
      try {
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, stream: true, messages: [{ role: 'system', content: system }, ...messages.map(m => ({ role: m.role, content: m.content }))] }),
          signal
        });
        if (!res.ok) throw new Error(`OpenAI خطأ ${res.status}`);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n'); buf = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const d = line.slice(6);
              if (d === '[DONE]') continue;
              try {
                const p = JSON.parse(d);
                if (p.choices?.[0]?.delta?.content) onChunk(p.choices[0].delta.content);
              } catch {}
            }
          }
        }
      } catch (e) { if (e.name !== 'AbortError') onError(e.message); }
    }

    async function streamGemini(apiKey, model, system, messages, onChunk, onError, signal) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?key=${apiKey}&alt=sse`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ system_instruction: { parts: [{ text: system }] }, contents: messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })) }),
          signal
        });
        if (!res.ok) throw new Error(`Gemini خطأ ${res.status}`);
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n'); buf = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const p = JSON.parse(line.slice(6));
                const text = p.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) onChunk(text);
              } catch {}
            }
          }
        }
      } catch (e) { if (e.name !== 'AbortError') onError(e.message); }
    }

    function App() {
      const [agent, setAgent] = useState(() => getSavedAgent());
      const [collapsed, setCollapsed] = useState(false);
      const [messages, setMessages] = useState(() => getSavedMessages());
      const [input, setInput] = useState('');
      const [streaming, setStreaming] = useState(false);
      const abortRef = useRef(null);
      const [knowledgeIds, setKnowledgeIds] = useState(() => getSavedKnowledgeIds());
      const [showSettings, setShowSettings] = useState(false);
      const [showKnowledge, setShowKnowledge] = useState(false);
      const [keys, setKeysState] = useState(getKeys());
      const messagesEndRef = useRef(null);
      const textareaRef = useRef(null);
      const lastMsgCountRef = useRef(messages.length);

      useEffect(() => {
        if (messages.length > lastMsgCountRef.current) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
        lastMsgCountRef.current = messages.length;
      }, [messages.length]);

      useEffect(() => { safeSet('nexus_agent', agent); }, [agent]);
      useEffect(() => { safeSet('nexus_messages', messages); }, [messages]);
      useEffect(() => { safeSet('nexus_knowledgeIds', knowledgeIds); }, [knowledgeIds]);

      const currentKey = keys[agent.preferredProvider] || '';

      const getSystemPrompt = (a) => `أنت ${a.name}. ${a.description}. أجب بالعربية الفصحى، مختصراً ومفيداً.`;

      const handleSend = useCallback(async (text) => {
        if (!text.trim() || streaming) return;
        if (!currentKey) {
          setMessages(prev => [...prev, { role: 'assistant', content: '⚠️ يرجى إدخال مفتاح API في الإعدادات أولاً.' }]);
          return;
        }

        const userMsg = { role: 'user', content: text };
        const assistantMsg = { role: 'assistant', content: '' };
        const newMessages = [...messages, userMsg, assistantMsg];
        setMessages(newMessages);
        setInput('');
        setStreaming(true);
        const ctrl = new AbortController();
        abortRef.current = ctrl;

        let system = getSystemPrompt(agent);
        if (knowledgeIds.length > 0) {
          const allKb = getKnowledge().filter(k => knowledgeIds.includes(k.id));
          if (allKb.length) {
            const ctx = allKb.map(d => `### ${d.title}\n${d.content}`).join('\n\n---\n\n');
            system += `\n\n[قاعدة معرفية مرفقة]\n${ctx}`;
          }
        }

        const apiMessages = [...messages, userMsg];

        const onChunk = (chunk) => {
          setMessages(prev => {
            const updated = [...prev];
            const last = updated[updated.length - 1];
            if (last.role === 'assistant') updated[updated.length - 1] = { ...last, content: last.content + chunk };
            return updated;
          });
        };
        const onError = (msg) => {
          setMessages(prev => {
            const updated = [...prev];
            const last = updated[updated.length - 1];
            if (last.role === 'assistant') updated[updated.length - 1] = { ...last, content: `❌ ${msg}` };
            return updated;
          });
          setStreaming(false);
          abortRef.current = null;
        };
        const finish = () => {
          setStreaming(false);
          abortRef.current = null;
          setMessages(prev => {
            saveConversation({
              agentId: agent.id,
              agentName: agent.name,
              messages: JSON.stringify(prev),
              messageCount: prev.length,
              knowledgeIds,
              created_at: new Date().toISOString()
            });
            return prev;
          });
        };

        try {
          if (agent.preferredProvider === 'openai') await streamOpenAI(currentKey, agent.preferredModel, system, apiMessages, onChunk, onError, ctrl.signal);
          else if (agent.preferredProvider === 'anthropic') await streamAnthropic(currentKey, agent.preferredModel, system, apiMessages, onChunk, onError, ctrl.signal);
          else if (agent.preferredProvider === 'google') await streamGemini(currentKey, agent.preferredModel, system, apiMessages, onChunk, onError, ctrl.signal);
        } catch (e) {
          onError(e.message);
        } finally {
          finish();
        }
      }, [messages, agent, currentKey, knowledgeIds, streaming]);

      const stop = () => {
        abortRef.current?.abort();
        abortRef.current = null;
        setStreaming(false);
      };

      const clear = () => {
        abortRef.current?.abort();
        abortRef.current = null;
        setStreaming(false);
        setMessages([]);
      };

      const switchAgent = (a) => {
        abortRef.current?.abort();
        abortRef.current = null;
        setStreaming(false);
        setAgent(a);
        setMessages([]);
      };

      const renderMarkdown = (content) => {
        if (!content) return '';
        const raw = marked.parse(content, { breaks: true });
        return DOMPurify.sanitize(raw);
      };

      useEffect(() => {
        if (textareaRef.current) {
          textareaRef.current.style.height = 'auto';
          textareaRef.current.style.height = Math.min(textareaRef.current.scrollHeight, 200) + 'px';
        }
      }, [input]);

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-900">
          <aside className={`card flex flex-col transition-all duration-300 ${collapsed ? 'w-16' : 'w-64'}`}>
            <div className="p-4 flex items-center justify-between border-b border-slate-700">
              {!collapsed && <h1 className="text-lg font-bold text-cyan-400">Nexus Agents</h1>}
              <button onClick={() => setCollapsed(!collapsed)} className="p-1 hover:bg-white/10 rounded">
                {collapsed ? <PanelLeftOpen size={20} /> : <PanelLeftClose size={20} />}
              </button>
            </div>
            <nav className="flex-1 overflow-y-auto p-2 space-y-1 scrollbar-thin">
              {AGENTS.map(a => {
                const Icon = a.icon || Bot;
                const active = agent.id === a.id;
                return (
                  <button key={a.id} onClick={() => switchAgent(a)}
                    className={`w-full flex items-center gap-3 p-2 rounded-lg transition-all ${active ? 'agent-active border' : 'hover:bg-white/5 text-gray-300'}`}>
                    <Icon size={20} className="shrink-0" />
                    {!collapsed && (
                      <div className="text-right flex-1 overflow-hidden">
                        <div className="text-sm font-medium truncate">{a.name}</div>
                        <div className="text-xs text-gray-500 truncate">{a.description}</div>
                      </div>
                    )}
                  </button>
                );
              })}
            </nav>
          </aside>

          <main className="flex-1 flex flex-col min-w-0">
            <header className="border-b border-slate-700 p-3 flex items-center justify-between card">
              <div className="flex items-center gap-3">
                <div className="text-cyan-400">{React.createElement(agent.icon || Bot, { size: 24 })}</div>
                <div>
                  <h2 className="font-bold">{agent.name}</h2>
                  <span className="text-xs text-gray-400">{agent.providerLabel}</span>
                </div>
              </div>
              <div className="flex gap-2 items-center">
                {messages.length > 0 && <button onClick={clear} className="text-xs text-gray-400 hover:text-white mr-2">جديد</button>}
                <button onClick={() => setShowKnowledge(true)} className="p-2 hover:bg-white/10 rounded relative" title="قاعدة المعرفة">
                  <Library size={20} />
                  {knowledgeIds.length > 0 && <span className="absolute -top-1 -right-1 bg-cyan-500 text-black text-xs rounded-full w-4 h-4 flex items-center justify-center">{knowledgeIds.length}</span>}
                </button>
                <button onClick={() => setShowSettings(true)} className="p-2 hover:bg-white/10 rounded" title="الإعدادات">
                  <Settings size={20} />
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin">
              {messages.length === 0 && (
                <div className="text-center text-gray-500 mt-20">
                  <Bot size={48} className="mx-auto mb-4 text-cyan-500/50" />
                  <p className="text-lg">مرحباً بك في Nexus Agents</p>
                  <p className="text-sm">اختر وكيلاً وابدأ المحادثة</p>
                </div>
              )}
              {messages.map((msg) => (
                <div key={msg.id || Math.random().toString(36).slice(2)} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] p-3 rounded-xl ${msg.role === 'user' ? 'bg-cyan-500/20 text-cyan-100' : 'bg-white/5 text-gray-200'}`}>
                    {msg.role === 'assistant' ? (
                      <div className="prose max-w-none" dangerouslySetInnerHTML={{ __html: renderMarkdown(msg.content) }} />
                    ) : (
                      <p className="whitespace-pre-wrap">{msg.content}</p>
                    )}
                  </div>
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>

            <div className="border-t border-slate-700 p-3 flex gap-2 items-end card">
              <textarea
                ref={textareaRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(input); } }}
                placeholder="اكتب رسالتك..."
                rows={1}
                className="flex-1 bg-black/30 rounded-lg p-3 resize-none focus:ring-1 focus:ring-cyan-500 min-h-[44px] max-h-[200px]"
                dir="rtl"
              />
              {streaming ? (
                <button onClick={stop} className="p-3 btn-red rounded-lg"><Square size={20} /></button>
              ) : (
                <button onClick={() => handleSend(input)} disabled={!input.trim()} className="p-3 btn-cyan rounded-lg disabled:opacity-50"><Send size={20} /></button>
              )}
            </div>
          </main>

          {showSettings && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
              <div className="card rounded-xl p-6 w-full max-w-md">
                <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Key className="text-cyan-400" /> مفاتيح API</h3>
                <p className="text-xs text-gray-400 mb-4">أدخل مفتاحاً واحداً على الأقل لتفعيل المزوّد</p>
                {['openai', 'anthropic', 'google'].map(p => (
                  <div key={p} className="mb-3">
                    <label className="text-sm text-gray-300 capitalize">{p}</label>
                    <input type="password" value={keys[p] || ''} onChange={e => setKeysState({...keys, [p]: e.target.value})}
                      placeholder={p === 'openai' ? 'sk-...' : p === 'anthropic' ? 'sk-ant-...' : 'AIza...'}
                      className="w-full mt-1 bg-black/30 border border-white/10 rounded-lg p-2 focus:ring-cyan-500" />
                  </div>
                ))}
                <div className="flex justify-end gap-3 mt-6">
                  <button onClick={() => setShowSettings(false)} className="px-4 py-2 btn-gray rounded-lg">إلغاء</button>
                  <button onClick={() => { setKeys(keys); setShowSettings(false); }} className="px-4 py-2 bg-cyan-500/80 hover:bg-cyan-500 rounded-lg">حفظ</button>
                </div>
              </div>
            </div>
          )}

          {showKnowledge && (
            <KnowledgeModal
              selectedIds={knowledgeIds}
              onSelectionChange={setKnowledgeIds}
              onClose={() => setShowKnowledge(false)}
            />
          )}
        </div>
      );
    }

    function KnowledgeModal({ selectedIds, onSelectionChange, onClose }) {
      const [docs, setDocs] = useState(getKnowledge());
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      const refresh = () => setDocs(getKnowledge());

      const add = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) return;
        const items = getKnowledge();
        items.unshift({ id: Date.now(), title, content, agentId: null, created_at: new Date().toISOString() });
        setKnowledge(items);
        setTitle('');
        setContent('');
        refresh();
      };

      const remove = (id) => {
        setKnowledge(getKnowledge().filter(i => i.id !== id));
        refresh();
        onSelectionChange(selectedIds.filter(i => i !== id));
      };

      const toggle = (id) => {
        onSelectionChange(selectedIds.includes(id) ? selectedIds.filter(i => i !== id) : [...selectedIds, id]);
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
          <div className="card rounded-xl p-6 w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-xl font-bold flex items-center gap-2"><Library className="text-cyan-400" /> قاعدة المعرفة</h3>
              <button onClick={onClose} className="p-1 hover:bg-white/10 rounded"><X size={20} /></button>
            </div>
            <form onSubmit={add} className="flex gap-3 mb-4">
              <input placeholder="عنوان المستند" value={title} onChange={e => setTitle(e.target.value)} className="flex-1 bg-black/30 border border-white/10 rounded-lg p-2" />
              <button type="submit" className="px-4 btn-cyan rounded-lg"><Plus size={18} /></button>
            </form>
            <textarea placeholder="محتوى المستند..." value={content} onChange={e => setContent(e.target.value)} rows={4} className="bg-black/30 border border-white/10 rounded-lg p-2 mb-4 resize-none" />
            <div className="flex-1 overflow-y-auto space-y-2 scrollbar-thin">
              {docs.length === 0 && <p className="text-gray-500 text-center">لا توجد مستندات</p>}
              {docs.map(doc => (
                <div key={doc.id} className={`flex items-center justify-between p-3 rounded-lg border ${selectedIds.includes(doc.id) ? 'border-cyan-500/50 bg-cyan-500/10' : 'border-white/5 hover:bg-white/5'}`}>
                  <div className="flex items-center gap-3 flex-1 min-w-0">
                    <input type="checkbox" checked={selectedIds.includes(doc.id)} onChange={() => toggle(doc.id)} className="shrink-0" />
                    <span className="truncate font-medium">{doc.title}</span>
                  </div>
                  <button onClick={() => remove(doc.id)} className="text-red-400 hover:text-red-300 p-1"><Trash2 size={16} /></button>
                </div>
              ))}
            </div>
            <p className="text-xs text-gray-500 mt-3">المستندات المحددة ستُضاف كسياق في المحادثة الحالية.</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
